name: UniLex dataset quality acceptance

on:
  push:
    branches: [verify/dataset-quality-20261009]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dataset-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare against the precise original production dataset
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 2238f61965c45b4a4794d7dfdcf9a3bf0e7a6f2e
          git show 2238f61965c45b4a4794d7dfdcf9a3bf0e7a6f2e:backend/unilex_dataset.csv > /tmp/unilex_dataset_before.csv
          python - <<'PY'
          import csv
          from collections import Counter
          original=''/'' if False else '/tmp/unilex_dataset_before.csv'
          modified='backend/unilex_dataset.csv'
          def load(path):
              with open(path,encoding='utf-8-sig',newline='') as f:
                  rdr=csv.DictReader(f)
                  cols=rdr.fieldnames
                  rows=list(rdr)
              assert cols==['term','formal_definition','student_friendly_explanation','example','category','difficulty','related_terms','source'],cols
              assert len(rows)==3067,(path,len(rows))
              assert all(all(isinstance(v,str) and v.strip() for v in row.values()) for row in rows),path
              assert len(set(r['term'].casefold() for r in rows))==3067
              return rows
          before=load(original)
          after=load(modified)
          expected={
             'APPS': {'student_friendly_explanation','example'},
             'AIME Benchmark': {'student_friendly_explanation'},
             'Cross-validation': {'example'},
             'The Cap Theorem.': {'student_friendly_explanation'},
          }
          changed={}
          for b,a in zip(before,after):
              assert b['term']==a['term'],(b['term'],a['term'])
              diffs={key for key in a if a[key]!=b[key]}
              if diffs:
                  changed[a['term']]=diffs
                  assert a['term'] in expected and diffs==expected[a['term']],(a['term'],diffs)
              assert a['source']==b['source'],"Do not overwrite provenance"
              assert a['category']==b['category'] and a['difficulty']==b['difficulty']
          assert changed==expected,(changed,expected)
          m={r['term']:r for r in after}
          assert 'AIME Benchmark' not in m['APPS']['example']
          assert 'Python' in m['APPS']['example'] and 'test cases' in m['APPS']['example']
          assert 'AMC 10' in m['AIME Benchmark']['student_friendly_explanation']
          assert 'USAMO' not in m['AIME Benchmark']['student_friendly_explanation']
          assert 'five folds' in m['Cross-validation']['example']
          assert 'network partition' in m['The Cap Theorem.']['student_friendly_explanation']
          print('DATASET QA PASSED: 3067 rows; exactly 4 verified records modified; all other cells and provenance unchanged.',flush=True)
          PY
      - name: Install lean TF-IDF requirements
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 scikit-learn==1.6.1 numpy==1.26.4 nltk==3.9.1
      - name: Check the deployed dataset loader and search behavior
        shell: bash
        run: |
          python - <<'PY'
          import sys, types
          sys.modules['spacy']=types.ModuleType('spacy')
          sys.path.insert(0,'backend')
          from data_loader import load_dataset,build_search_text
          from search_tfidf import TfidfSearch
          df=load_dataset()
          assert len(df)==3067
          engine=TfidfSearch(df,[build_search_text(r) for _,r in df.iterrows()])
          checks=[
             ('Overfitting',{'Overfitting'}),
             ('APPS',{'APPS'}),
             ('AIME Benchmark',{'AIME Benchmark'}),
             ('Cross-validation',{'Cross-validation'}),
             ('The Cap Theorem.',{'The Cap Theorem.'}),
             ('Which data structure follows first in first out?',{'Queue','A Queue Data Structure'}),
             ('Which data structure follows last in first out?',{'Stack','A Stack Data Structure'}),
          ]
          for q,allowed in checks:
              terms=[df.iloc[h['index']]['term'] for h in engine.search(q)]
              print('SEARCH',repr(q),terms[:5],flush=True)
              assert terms and terms[0] in allowed,(q,terms)
          for q in ['','xyzabc123','why does lamya call herself a queen?']:
              terms=[df.iloc[h['index']]['term'] for h in engine.search(q)]
              print('NEGATIVE',repr(q),terms,flush=True)
              assert not terms,(q,terms)
          print('DATASET SEARCH SMOKE PASSED',flush=True)
          PY

  semantic-regression:
    if: false
    needs: [dataset-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU-only semantic model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==1.26.4 scikit-learn==1.6.1 nltk==3.9.1 sentence-transformers==3.4.1 transformers==4.48.3
      - name: Test SBERT against the corrected full 3067-row dataset
        shell: bash
        run: |
          python - <<'PY'
          import sys,time
          sys.path.insert(0,'backend')
          from data_loader import load_dataset,build_search_text
          from search_semantic import SemanticSearch
          df=load_dataset()
          model=SemanticSearch(df,[build_search_text(r) for _,r in df.iterrows()],cache_dir='backend')
          cases=[
            ('Overfitting',{'Overfitting'}),
            ('Machine Learning',{'Machine Learning'}),
            ('Why does my model perform well on training data but poorly on unseen data?',{'Overfitting','Overfitting In Machine Learning'}),
            ('Which data structure follows first in first out?',{'Queue','A Queue Data Structure'}),
            ('Which data structure follows last in first out?',{'Stack','A Stack Data Structure'}),
            ('How do I predict a continuous numerical value from input features?',{'Regression'}),
            ('I need to predict a house price rather than a category.',{'Regression','Linear Regression'}),
            ('How do I determine whether a review is positive or negative?',{'Sentiment Analysis','Sentiment Analysis In Nlp'}),
            ('What is it called when test information accidentally enters model training?',{'Data Leakage','Pipeline Leakage'}),
            ('AIME Benchmark',{'AIME Benchmark'}),
            ('APPS',{'APPS'}),
            ('Cross-validation',{'Cross-validation'}),
            ('The Cap Theorem.',{'The Cap Theorem.'}),
            ('What pizza should I order tonight?',set()),
            ('why does lamya call herself a queen?',set()),
            ('xyzabc123',set()),
            ('',set())
          ]
          for query,expected in cases:
              started=time.monotonic()
              found=[df.iloc[x['index']]['term'] for x in model.search(query,top_k=5)]
              print('SEMANTIC',repr(query),found[:5],round(time.monotonic()-started,2),flush=True)
              if expected:
                  assert found and found[0] in expected,(query,found)
              else:
                  assert found==[],(query,found)
          print('SEMANTIC REGRESSION PASSED',len(cases),'CASES',flush=True)
          PY

  live-production-smoke:
    needs: [dataset-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify the newly deployed dataset and search through production API
        shell: bash
        run: |
          python - <<'PY'
          import json,time
          from urllib.parse import urlencode,quote
          from urllib.request import urlopen
          base="https://unilex-samar.onrender.com"
          def get(path,params=None):
              url=base+path+('?' + urlencode(params) if params else '')
              for attempt in range(2):
                  try:
                      with urlopen(url,timeout=150) as response:
                          return response.status,json.load(response)
                  except Exception as e:
                      if attempt: raise
                      print('RETRY',path,repr(e),flush=True);time.sleep(7)
          code,health=get('/health')
          assert code==200 and health['terms_loaded']==3067 and health['semantic_search_available'] is True,health
          print('LIVE DATASET HEALTH',health['terms_loaded'],flush=True)
          checks={
              'APPS':('example',['Python','test cases'],['AIME Benchmark']),
              'AIME Benchmark':('student_friendly_explanation',['AMC 10','AMC 12'],['USAMO']),
              'Cross-validation':('example',['five folds','validation fold'],[]),
              'The Cap Theorem.':('student_friendly_explanation',['network partition','consistency','availability'],[])
          }
          for term,(field,required,forbidden) in checks.items():
              code,item=get('/term/'+quote(term,safe=''))
              assert code==200 and item['term']==term,(term,code,item)
              value=item[field]
              assert all(word.casefold() in value.casefold() for word in required),(term,value)
              assert not any(word.casefold() in value.casefold() for word in forbidden),(term,value)
              print('LIVE CORRECTED',term,field,value[:145],flush=True)
          code,kw=get('/search',{'q':'APPS','top_k':5})
          assert code==200 and kw['results'][0]['term']=='APPS'
          code,semantic=get('/search/semantic',{'q':'I need to predict a house price rather than a category.','top_k':5})
          terms=[x['term'] for x in semantic['results']]
          print('LIVE SBERT REGRESSION',terms,flush=True)
          assert code==200 and terms and terms[0] in ('Regression','Linear Regression')
          code,semantic=get('/search/semantic',{'q':'How do I determine whether a review is positive or negative?','top_k':5})
          terms=[x['term'] for x in semantic['results']]
          print('LIVE SBERT SENTIMENT',terms,flush=True)
          assert code==200 and terms and terms[0] in ('Sentiment Analysis','Sentiment Analysis In Nlp')
          code,bad=get('/search/semantic',{'q':'What pizza should I order tonight?','top_k':5})
          assert code==200 and bad['results']==[],bad
          print('PRODUCTION DATASET & SEARCH SMOKE PASSED',flush=True)
          PY
