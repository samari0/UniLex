name: UniLex live keyword verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [verify/live-keyword-20261009]

permissions:
  contents: read

jobs:
  live-keyword:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test deployed UniLex API (no production code changes)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode
          from urllib.request import urlopen
          from urllib.error import HTTPError

          base = "https://unilex-samar.onrender.com"

          def get(path, **params):
              url = base + path + ("?" + urlencode(params) if params else "")
              for attempt in range(2):
                  try:
                      with urlopen(url, timeout=120) as response:
                          payload = json.load(response)
                          print("HTTP", response.status, path, repr(params), flush=True)
                          return payload
                  except Exception as e:
                      if attempt:
                          raise
                      print("Transient request issue:", repr(e), flush=True)
                      time.sleep(7)

          health = get("/health")
          print("HEALTH", health, flush=True)
          assert health.get("status") == "ok"
          assert health.get("terms_loaded") == 3067

          cases = [
              ("exact Overfitting", "Overfitting", "Overfitting"),
              ("exact machine learning", "machine learning", "Machine Learning"),
              ("word not in dictionary", "xyzabc123", None),
              ("unrelated personal question", "why does lamya call herself a queen?", None),
              ("empty input", "", None),
          ]
          for name, query, expected_top in cases:
              data = get("/search", q=query, top_k=5)
              terms = [entry["term"] for entry in data["results"]]
              print("CASE", name, "RESULTS", terms, flush=True)
              assert data["method"] == "tfidf"
              if expected_top is None:
                  assert not terms, (name, terms)
              else:
                  assert terms and terms[0] == expected_top, (name, terms)

          memorization = get("/search", q="why does a model memorize training data?", top_k=5)
          terms = [entry["term"] for entry in memorization["results"]]
          print("CASE memorization RESULTS", terms, flush=True)
          assert terms, "Keyword Search must not return an empty result for an in-domain question."
          assert any(t in {"Overfitting", "Overfitting In Machine Learning",
                           "Overfitting In Ai.", "Canary Insertion"}
                     for t in terms), ("Missing any relevant memorization concept", terms)

          fifo = get("/search", q="Which data structure follows first in first out?", top_k=5)
          fifo_terms = [entry["term"] for entry in fifo["results"]]
          print("DIAGNOSTIC FIFO", fifo_terms, flush=True)
          assert fifo_terms and fifo_terms[0] in {"Queue", "A Queue Data Structure"}, fifo_terms

          lifo = get("/search", q="Which data structure follows last in first out?", top_k=5)
          lifo_terms = [entry["term"] for entry in lifo["results"]]
          print("DIAGNOSTIC LIFO", lifo_terms, flush=True)
          assert lifo_terms and lifo_terms[0] in {"Stack", "A Stack Data Structure"}, lifo_terms
          print("LIVE KEYWORD TESTS PASSED", flush=True)

          semantic = get("/search/semantic", q="Why does my model perform well on training data but poorly on unseen data?", top_k=5)
          semantic_terms = [entry["term"] for entry in semantic["results"]]
          print("SEMANTIC OVERFITTING", semantic_terms, flush=True)
          assert semantic["method"] == "sbert"
          assert semantic_terms and semantic_terms[0] in {"Overfitting", "Overfitting In Machine Learning","Overfitting In Ai."}, semantic_terms
          print("LIVE SMART SEARCH SMOKE PASSED", flush=True)

          from urllib.request import Request
          request = Request(base + "/extract",
                            data=json.dumps({"text":"Machine learning models can suffer from overfitting."}).encode(),
                            headers={"Content-Type":"application/json"},method="POST")
          with urlopen(request, timeout=90) as response:
              result = json.load(response)
              extracted = [entry["term"] for entry in result["terms_found"]]
              print("LIVE EXTRACTION", response.status, extracted, flush=True)
              assert any(term == "Machine Learning" for term in extracted), extracted
              assert any("Overfitting" in term for term in extracted), extracted
          print("LIVE SMOKE CHECKS PASSED", flush=True)
          PY

  patched-keyword-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install TF-IDF dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 scikit-learn==1.6.1 nltk==3.9.1
      - name: Run real dataset regression against changed file
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import types
          sys.modules["spacy"] = types.ModuleType("spacy")
          sys.path.insert(0,"backend")
          from data_loader import load_dataset, build_search_text
          from search_tfidf import TfidfSearch

          df=load_dataset()
          engine=TfidfSearch(df,[build_search_text(row) for _,row in df.iterrows()])

          cases=[
            ("Overfitting",{"Overfitting"}),
            ("machine learning",{"Machine Learning"}),
            ("Which data structure follows first in first out?",{"Queue","A Queue Data Structure"}),
            ("Which data structure follows last in first out?",{"Stack","A Stack Data Structure"}),
            ("First-In-First-Out",{"Queue","A Queue Data Structure","The First-In, First-Out Page Replacement Algorithm."}),
            ("Last-In-First-Out",{"Stack","A Stack Data Structure"}),
          ]
          for query,expected in cases:
            names=[df.iloc[result["index"]]["term"] for result in engine.search(query)]
            print("QUERY",repr(query),"RESULT",names,flush=True)
            assert names and names[0] in expected, (query,names)

          for query in ["","   ","xyzabc123","why does lamya call herself a queen?","What pizza should I order tonight?"]:
            names=[df.iloc[result["index"]]["term"] for result in engine.search(query)]
            print("NEGATIVE",repr(query),"RESULT",names,flush=True)
            assert names == [],(query,names)

          q="why does a model memorize training data?"
          names=[df.iloc[result["index"]]["term"] for result in engine.search(q)]
          print("MEMORIZATION",names,flush=True)
          assert any(x in names for x in ["Overfitting","Overfitting In Ai.","Overfitting In Machine Learning","Canary Insertion"])
          print("PATCHED TF-IDF REGRESSION PASSED",flush=True)
          PY
